# Configuracion global de Cucumber
# Reportes: consola (pretty) + JSON + HTML + XML (junit) en target/cucumber-report/
cucumber.plugin=pretty, json:target/cucumber-report/cucumber.json, html:target/cucumber-report/cucumber.html, junit:target/cucumber-report/cucumber-xml.xml
cucumber.execution.parallel.enabled=false
# restringe el escaneo de step definitions -> evita warnings de byte-buddy/JNA
cucumber.glue=cl.duoc.lab.bdd
